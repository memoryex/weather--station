<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>">
<title>GD Mobilus - Statusas</title>
<style>
  :root {
    --bg-body: #121212;
    --text-main: #e5e5e5;
    --text-muted: #bbb;
    --bg-card: #1a1a1a;
    --border-color: #333;
    --accent-color: #0d6efd;
    --good: #00d67a;
    --warn: #ffa726;
    --bad: #ff5252;
  }

  body {
    background: var(--bg-body);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  h1 { font-size: 20px; text-align: center; margin: 10px 0; }

  #summaryBox { text-align: center; font-size: 16px; color: #4fc3f7; margin-bottom: 5px; }
  #timerBox { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }

  .filter-bar {
    display: flex; justify-content: center; margin-bottom: 15px;
  }
  .report-select {
    padding: 10px; background: #1c1c1c; border: 1px solid #444; color: #fff; border-radius: 8px; width: 100%; max-width: 200px;
  }

  .line-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .line-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
  }
  .line-name { font-size: 18px; font-weight: bold; }
  .line-status { font-size: 12px; font-weight: bold; text-transform: uppercase; }
  .status-online { color: var(--good); }
  .status-offline { color: var(--bad); }

  .line-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
  .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
  .value { font-weight: 500; }

  .product-name { color: #4fc3f7; font-weight: bold; grid-column: span 2; margin-top: 4px; }

  .controls {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    transition: opacity 0.2s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-reset { background: #444; border: 1px solid #666; }
  .btn-dec { background: #444; border: 1px solid #666; font-size: 20px; }

  .btn.waiting { background: var(--warn); }
  .btn.updating { background: var(--bad); }

  .adax-groups {
    grid-column: span 2;
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.2);
    padding: 5px;
    border-radius: 4px;
    text-align: center;
  }

  .loading { text-align: center; padding: 40px; color: var(--text-muted); }

  .separator {
    text-align: center;
    background: #333;
    padding: 5px;
    margin: 20px -10px 10px -10px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
  }
</style>
</head>

  ["80905", "XLE050 0.50kW Dimplex (Case Only)"],

]);

/* --- HELPERS --- */
const pad2 = n => String(n).padStart(2,'0');
function toLT(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleString("lt-LT", {
    hour:"2-digit", minute:"2-digit"
  });
}
function normalizeCode(v){
  const digits = String(v ?? "").replace(/\D/g,'');
  if(!digits) return "";
  return digits.replace(/^0+/, '') || '0';
}
async function fetchWithTimeout(resource, options = {}) {
  const { timeout = 10000 } = options;
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    return await fetch(resource, { ...options, signal: controller.signal });
  } finally { clearTimeout(id); }
}

/* --- STATE --- */
window.actionQueue = [];
window.actionStates = {};
window.isProcessingAction = false;

/* --- LOGIC --- */
async function refresh() {
  const container = document.getElementById("data-container");
  const filter = document.getElementById("sortBy").value;

  const now = Date.now();
  const d0 = new Date(now); d0.setHours(6, 0, 0, 0);
  const tz = "Europe/Vilnius";

  const adaxProxy = localStorage.getItem('adax_proxy') || 'http://localhost:8081/adax/all';
  let adaxAggregated = null;
  try {
    const r = await fetchWithTimeout(adaxProxy, { timeout: 5000 });
    if(r.ok) adaxAggregated = await r.json();
  } catch(e) {}

  const promises = LINES.map(async (L) => {
    try {
      if (L.apiType === "ADAX") {
        if (!adaxAggregated || !adaxAggregated.lines[L.lid]) return null;
        const cached = adaxAggregated.lines[L.lid];
        if (cached.error) return null;

        let allRecords = [];
        if (Array.isArray(cached.data)) allRecords = cached.data;
        else for (let p in cached.data) allRecords.push(...cached.data[p]);

        allRecords = allRecords.filter(r => !['111111','222222','333333','444444','666666','777777'].includes(r.Produktas));
        if (!allRecords.length) return null;

        allRecords.sort((a,b) => new Date(a.TestavimoLaikas.replace(' ','T')) - new Date(b.TestavimoLaikas.replace(' ','T')));
        const latest = allRecords[allRecords.length-1];
        const lastTs = new Date(latest.TestavimoLaikas.replace(' ','T')).getTime();
        const active = (now - lastTs) / 60000 <= 720;

        let productName = "—";
        const code = normalizeCode(latest.Produktas);
        if (latest.ItemID && latest.Pavadinimas) productName = `${latest.ItemID} - ${latest.Pavadinimas}`;
        else if (PRODUCT_MAP.has(code)) productName = PRODUCT_MAP.get(code);

        return { L, units: latest.PusgaminioNr, product: productName, lastSeen: latest.TestavimoLaikas, active, type: "ADAX" };
      } else {
        const key = READ_KEYS[L.channel];
        const rLast = await fetchWithTimeout(`https://api.thingspeak.com/channels/${L.channel}/fields/${L.fieldCount}/last.json?api_key=${key}`);
        if (!rLast.ok) return null;
        const lastData = await rLast.json();

        let barcodeVal = "—";
        if (L.fieldBarcode) {
          const rBar = await fetchWithTimeout(`https://api.thingspeak.com/channels/${L.channel}/fields/${L.fieldBarcode}/last.json?api_key=${key}`);
          if (rBar.ok) {
            const barData = await rBar.json();
            const code = normalizeCode(barData[`field${L.fieldBarcode}`]);
            barcodeVal = PRODUCT_MAP.get(code) || barData[`field${L.fieldBarcode}`] || "—";
          }
        } else if (L.name === "UI perrašymas") {
          barcodeVal = "ECU-2Rw";
        }

        const lastTs = new Date(lastData.created_at).getTime();
        const active = (now - lastTs) / 60000 <= 720;

        return {
          L,
          units: lastData[`field${L.fieldCount}`],
          product: barcodeVal,
          lastSeen: lastData.created_at,
          active,
          type: "TS"
        };
      }
    } catch(e) { return null; }
  });

  const results = (await Promise.all(promises)).filter(r => r);

  let html = "";
  let groups = { "GD Linijos": [], "ADAX Linijos": [], "UI perrašymas": [] };

  results.forEach(r => {
    if (filter === 'active' && !r.active) return;
    if (filter === 'inactive' && r.active) return;

    if (r.L.name === "UI perrašymas") groups["UI perrašymas"].push(r);
    else if (r.type === "ADAX") groups["ADAX Linijos"].push(r);
    else groups["GD Linijos"].push(r);
  });

  for (let gName in groups) {
    if (groups[gName].length > 0) {
      html += `<div class="separator">${gName}</div>`;
      groups[gName].forEach(r => {
        const aState = window.actionStates[r.L.name] || { status: 'idle' };
        const isWaiting = aState.status !== 'idle';

        html += `
          <div class="line-card">
            <div class="line-header">
              <span class="line-name">${r.L.name}</span>
              <span class="line-status ${r.active ? 'status-online' : 'status-offline'}">${r.active ? 'Aktyvi' : 'Neaktyvi'}</span>
            </div>
            <div class="line-body">
              <div>
                <div class="label">Pagaminta</div>
                <div class="value" style="font-size: 24px; color: var(--good);">${r.units} vnt.</div>
              </div>
              <div style="text-align: right;">
                <div class="label">Paskutinis</div>
                <div class="value">${toLT(r.lastSeen)}</div>
              </div>
              <div class="product-name">${r.product}</div>
            </div>
            ${r.type === 'TS' ? `
              <div class="controls">
                <button class="btn btn-reset ${isWaiting ? aState.status : ''}"
                        onclick="triggerReset('${r.L.name}')" ${isWaiting ? 'disabled' : ''}>
                  ${isWaiting ? 'Laukite...' : 'RESET'}
                </button>
                <button class="btn btn-dec ${isWaiting ? aState.status : ''}"
                        onclick="triggerDecrement('${r.L.name}', ${r.units})" ${isWaiting ? 'disabled' : ''}>
                  ${isWaiting ? '...' : '-'}
                </button>
              </div>
            ` : ''}
          </div>
        `;
      });
    }
  }

  container.innerHTML = html || '<div class="loading">Nėra duomenų pagal filtrą</div>';
}

/* --- ACTIONS --- */
function triggerReset(name) { queueAction(name, 0); }
function triggerDecrement(name, cur) { queueAction(name, Math.max(0, cur - 1)); }

function queueAction(lineName, target) {
  if (window.actionStates[lineName]?.status !== 'idle' && window.actionStates[lineName]) return;
  window.actionStates[lineName] = { status: 'waiting' };
  window.actionQueue.push({ lineName, target });
  refresh();
  if (!window.isProcessingAction) processQueue();
}

async function processQueue() {
  if (!window.actionQueue.length) { window.isProcessingAction = false; return; }
  window.isProcessingAction = true;
  const action = window.actionQueue.shift();
  const line = LINES.find(l => l.name === action.lineName);

  window.actionStates[action.lineName].status = 'updating';
  refresh();

  const key = WRITE_KEYS[line.channel];
  try {
    const r = await fetch(`https://api.thingspeak.com/update?api_key=${key}&field${line.fieldCount}=${action.target}`, { method: 'POST' });
    if (r.ok) poll(line, action.target);
    else { window.actionStates[line.name].status = 'idle'; refresh(); }
  } catch(e) { window.actionStates[line.name].status = 'idle'; refresh(); }

  setTimeout(processQueue, 15500);
}

async function poll(line, target) {
  const key = READ_KEYS[line.channel];
  const check = async () => {
    try {
      const r = await fetch(`https://api.thingspeak.com/channels/${line.channel}/fields/${line.fieldCount}/last.json?api_key=${key}`);
      const data = await r.json();
      if (parseFloat(data[`field${line.fieldCount}`]) === target) {
        window.actionStates[line.name] = { status: 'idle' };
        refresh();
      } else setTimeout(check, 5000);
    } catch(e) { setTimeout(check, 5000); }
  };
  check();
}

/* --- TIMER --- */
let timeLeft = 120;
setInterval(() => {
  timeLeft--;
  if (timeLeft <= 0) { timeLeft = 120; refresh(); }
  document.getElementById("timerBox").innerText = `Atnaujinimas po: ${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`;
}, 1000);

document.getElementById("sortBy").addEventListener("change", refresh);
refresh();
</script>
