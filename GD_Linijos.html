<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<title>GD Linijos – Ataskaita ir Statusas</title>
<style>
  /* --- GLOBAL & LAYOUT --- */
  body { background:#121212; color:#e5e5e5; font-family:Arial,Helvetica,sans-serif; margin:0; padding:0; }
  h1 { font-size:28px; text-align:center; margin:20px 0; color:#fff; }

  /* --- TABS --- */
  .tab-nav { display:flex; gap:10px; background:#1a1a1a; padding:10px 20px; border-bottom:1px solid #333; justify-content:center; }
  .tab-btn { padding:10px 20px; cursor:pointer; background:#333; color:#bbb; border:none; border-radius:4px; font-size:16px; transition:0.2s; }
  .tab-btn:hover { background:#444; color:#fff; }
  .tab-btn.active { background:#0d6efd; color:#fff; font-weight:bold; }

  .tab-pane { display:none; padding:20px; animation:fadeIn 0.3s; }
  .tab-pane.active { display:block; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* --- REPORT TAB STYLES --- */
  .wrap { width:95%; max-width:1200px; margin:0 auto; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .report-label { font-size:13px; color:#bbb; }
  .report-input, .report-select { padding:6px 8px; background:#1c1c1c; border:1px solid #444; color:#eee; border-radius:6px; }
  .msg { font-size:14px; color:#9ad; margin-top:6px; }
  .card { background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:14px; margin-top:12px; }

  /* --- STATUS TAB STYLES --- */
  #summaryBox { text-align:center; font-size:22px; margin-top:10px; color:#4fc3f7; }
  #timerBox { text-align:center; font-size:20px; color:#ccc; margin-top:5px; }
  .toolbar { width:95%; margin:10px auto 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }

  table { width:95%; margin:14px auto 20px; border-collapse:collapse; font-size:18px; }
  th, td { padding:14px; border-bottom:1px solid #333; text-align:center; }
  th { background:#222; color:#fff; font-size:20px; }

  .good { color:#00d67a; font-weight:bold; }
  .warn { color:#ffa726; font-weight:bold; }
  .bad  { color:#ff5252; font-weight:bold; }
  .bar  { color:#4fc3f7; font-weight:bold; }
  .time { font-size:16px; color:#ccc; }

  .status-online  { color:#00d67a; font-weight:bold; }
  .status-offline { color:#ff5252; font-weight:bold; }
  .loading { text-align:center; padding:20px; font-size:20px; color:#bbb; }

  /* --- SHARED BUTTONS --- */
  button.action-btn { padding:10px 14px; background:#0d6efd; border:none; border-radius:6px; color:#fff; cursor:pointer; }
  button.action-btn:disabled { opacity:0.5; cursor:not-allowed; }
  input[type="file"] { color:#ddd; }
</style>
<!-- XLSX (SheetJS) + ExcelJS + FileSaver – viskas iš CDN -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>

<!-- TAB NAVIGATION -->
<div class="tab-nav">
  <button class="tab-btn active" onclick="openTab('status')">GD linijų statusas</button>
  <button class="tab-btn" onclick="openTab('report')">Istorijos ataskaita</button>
</div>

<!-- ========================= TAB: STATUSAS ========================= -->
<div id="tab-status" class="tab-pane active">
  <h1>GD linijų būsena</h1>

  <div id="summaryBox">Bendras pagamintas kiekis: …</div>
  <div id="timerBox">Kitas atnaujinimas po: …</div>

  <div class="toolbar">
    <div>
      <label class="report-label">Įkelti „Barcode list … .xlsx“:</label><br/>
      <input id="statusMapFile" type="file" accept=".xlsx,.xls" />
    </div>
    <div id="statusMapInfo" class="msg"></div>
  </div>

  <table>
    <thead>
    <tr>
      <th>Linija</th>
      <th>Pagaminta vnt.</th>
      <th>Gaminys</th>
      <th>Gaminio pavadinimas</th>
      <th>Gaminio testavimo pradžia</th>
      <th>Paskutinis užfiksavimas</th>
      <th>Linijos būsena</th>
      <th>Tarpas tarp testų</th>
      <th>Greitis (vnt/val.)</th>
    </tr>
    </thead>
    <tbody id="data"></tbody>
  </table>
</div>

<!-- ========================= TAB: ATASKAITA ========================= -->
<div id="tab-report" class="tab-pane">
  <h1>GD linijų – Istorijos ataskaita</h1>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div>
          <label class="report-label">Nuo</label><br/>
          <input id="from" type="datetime-local" class="report-input"/>
        </div>
        <div>
          <label class="report-label">Iki</label><br/>
          <input id="to" type="datetime-local" class="report-input"/>
        </div>
        <div>
          <label class="report-label">Laiko zona</label><br/>
          <select id="tz" class="report-select">
            <option value="Europe/Vilnius" selected>Europe/Vilnius</option>
            <option value="UTC">UTC</option>
          </select>
        </div>
        <div>
          <label class="report-label">Laiko langas (dienomis, kai dalijam istoriją)</label><br/>
          <select id="chunkDays" class="report-select">
            <option>31</option><option selected>90</option><option>180</option>
          </select>
        </div>
        <div>
          <label class="report-label">Linijos (Ctrl/Shift – keli pasirinkimai)</label>
          <input type="checkbox" id="selectAllLines" style="margin-left: 8px; vertical-align: middle;">
          <label for="selectAllLines" style="font-size:13px;color:#bbb; vertical-align: middle; cursor:pointer;">Pažymėti visus</label>
          <br/>
          <select id="lineFilter" multiple size="6" class="report-select" style="min-width:220px;"></select>
        </div>
        <div>
          <label class="report-label">Gaminio pavadinimų sąrašas (.xlsx)</label><br/>
          <input id="reportMapFile" type="file" accept=".xlsx,.xls" />
          <div id="reportMapInfo" class="msg"></div>
        </div>
        <div>
          <label class="report-label">&nbsp;</label><br/>
          <button id="go" class="action-btn">Generuoti ataskaitą (XLSX)</button>
        </div>
      </div>
      <div id="repStatus" class="msg">Paruošta.</div>
    </div>
  </div>
</div>

<script>
/* ===================== SHARED CONFIG & GLOBALS ===================== */
const READ_KEYS = {
  463450: "VAL3TD2W5LADX7K1", // PLXE 1-4
  703669: "S44OBKWC5C7FODZ5", // NOBO 1-4
  802414: "I6NIZAVZYLPVV1ME"  // NOBO 5-7, PLXE 5
};

const LINES = [
  { name:"PLXE 1", channel:463450, fieldCount:1, fieldBarcode:2 },
  { name:"PLXE 2", channel:463450, fieldCount:3, fieldBarcode:4 },
  { name:"PLXE 3", channel:463450, fieldCount:5, fieldBarcode:6 },
  { name:"PLXE 4", channel:463450, fieldCount:7, fieldBarcode:8 },
  { name:"NOBO 1", channel:703669, fieldCount:1, fieldBarcode:2 },
  { name:"NOBO 2", channel:703669, fieldCount:3, fieldBarcode:4 },
  { name:"NOBO 3", channel:703669, fieldCount:5, fieldBarcode:6 },
  { name:"NOBO 4", channel:703669, fieldCount:7, fieldBarcode:8 },
  { name:"NOBO 5", channel:802414, fieldCount:1, fieldBarcode:2 },
  { name:"NOBO 6", channel:802414, fieldCount:3, fieldBarcode:4 },
  { name:"NOBO 7", channel:802414, fieldCount:5, fieldBarcode:6 },
  { name:"PLXE 5", channel:802414, fieldCount:7, fieldBarcode:8 }
];
// Alias for Status code compatibility
const LINE_MAP = LINES;

// Shared Map: "090775" -> "PLX070E"
const PRODUCT_MAP = new Map();

/* ===================== TAB LOGIC ===================== */
function openTab(tabName) {
  const tabs = document.getElementsByClassName("tab-pane");
  for (let i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove("active");
  }
  const btns = document.getElementsByClassName("tab-btn");
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.remove("active");
  }

  document.getElementById("tab-" + tabName).classList.add("active");
  // Find button that calls this function (rough approximation for simplicity)
  const clickedBtn = Array.from(btns).find(b => b.getAttribute('onclick').includes(tabName));
  if(clickedBtn) clickedBtn.classList.add("active");
}

/* ===================== SHARED HELPERS ===================== */
const pad2 = n => String(n).padStart(2,'0');

function toIsoLocal(date){
  const y=date.getFullYear(), M=pad2(date.getMonth()+1), d=pad2(date.getDate()),
        h=pad2(date.getHours()), m=pad2(date.getMinutes()), s=pad2(date.getSeconds());
  return `${y}-${M}-${d} ${h}:${m}:${s}`;
}
function parseISO(iso){ return new Date(iso); }

// Robust date formatter
function toLT(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleString("lt-LT", {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit"
  }).replace(",", "");
}
// Alias for Report compatibility
const toLTString = (iso, tz) => {
    if(!iso) return "";
    // Note: 'tz' argument from Report is used to force TimeZone.
    // toLT uses browser local time or default.
    // Let's implement exact Report logic if 'tz' is passed, else default.
    return new Date(iso).toLocaleString('lt-LT',{
        timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit'
    }).replace(',','');
};

function formatDuration(ms) {
  if (!isFinite(ms) || ms < 0) return "-";
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const ss = s % 60;
  return `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}
// Alias for Report compatibility
const msToHMS = formatDuration;

function normalizeCode(v){
  const digits = String(v ?? "").replace(/\D/g,'');
  if(!digits) return "";
  return (digits.length===5) ? ("0"+digits) : digits;
}

/* ===================== SHARED FILE LOADER ===================== */
async function loadProductMapFromXlsx(file, infoId){
  PRODUCT_MAP.clear();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });

  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    if(!ws) continue;
    const A = XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false });
    if(!A.length) continue;

    // 1) bandome rasti ItemID
    let headerRow=-1, itemCol=-1, nameCol=-1, loadedNameCol=-1, barcodeCol=-1;
    for(let r=0; r<Math.min(A.length, 10); r++){
      const row=A[r];
      for(let c=0;c<row.length;c++){
        const v = String(row[c]??"").trim().toLowerCase();
        if (v==="itemid" || v==="item id"){ headerRow=r; itemCol=c; nameCol=c+1; }
        if (v==="loaded name") loadedNameCol=c;
        if (v==="barcode") barcodeCol=c;
      }
      if(headerRow>=0) break;
    }

    // 2) užpildom žemėlapį:
    for(let r=(headerRow>=0? headerRow+1:1); r<A.length; r++){
      const row=A[r];
      let code = null;
      let name = null;

      // prioritetas 1: ItemID
      if(itemCol>=0 && headerRow>=0){
        const idRaw = row[itemCol];
        name  = (loadedNameCol>=0? row[loadedNameCol] : row[nameCol]);
        code  = normalizeCode(idRaw);
      }
      // prioritetas 2: Barcode (jei neradom pagal ItemID arba nėra ItemID stulpelio)
      if(!code && barcodeCol>=0){
        const b  = row[barcodeCol];
        name = (loadedNameCol>=0? row[loadedNameCol] : row[nameCol]);
        code = normalizeCode(b);
      }

      if(code && name!=null && String(name).trim()!==""){
        PRODUCT_MAP.set(code, String(name).trim());
      }
    }
  }

  const info = document.getElementById(infoId);
  if(info) info.textContent = `Įkelta pavadinimų: ${PRODUCT_MAP.size}. (Kodai lyginami pagal 6 skaitmenis)`;

  // Update both interfaces if needed
  if(typeof refresh === 'function') refresh(); // Update Status table
}

/* ================================================================================================
   LOGIC: STATUS TAB
   ================================================================================================ */
(function InitStatus(){
    const OFFLINE_MINUTES = 60;
    const REFRESH_MS = 120000;
    let timer = REFRESH_MS / 1000;

    async function getFieldLast(channel, field, key) {
        try {
            const url = `https://api.thingspeak.com/channels/${channel}/fields/${field}/last.json?api_key=${key}`;
            const r = await fetch(url);
            if (!r.ok) throw "HTTP error";
            return r.json();
        } catch { return null; }
    }
    async function getFieldHistory(channel, field, key, results=50) {
        try {
            const url = `https://api.thingspeak.com/channels/${channel}/fields/${field}.json?api_key=${key}&results=${results}`;
            const r = await fetch(url);
            if (!r.ok) throw "HTTP error";
            return r.json();
        } catch { return null; }
    }
    function getLastValidCountPair(history, fieldN) {
        if (!history?.feeds) return null;
        const list = history.feeds
            .map(f => {
            const c = parseFloat(f[`field${fieldN}`]);
            const t = new Date(f.created_at).getTime();
            return isFinite(c) ? {c,t} : null;
            })
            .filter(x => x)
            .sort((a,b) => a.t - b.t);
        if (list.length < 2) return null;
        for (let i = list.length-2; i >= 0; i--) {
            const a = list[i], b = list[i+1];
            if (b.c > a.c && b.t > a.t) return {c0:a.c, c1:b.c, t0:a.t, t1:b.t};
        }
        return null;
    }

    // Expose refresh globally so file loader can call it
    window.refresh = async function() {
        const tbody = document.getElementById("data");
        if(!tbody) return;
        tbody.innerHTML = "<tr><td class='loading' colspan='9'>Kraunama...</td></tr>";

        let html = "";
        let totalCount = 0;
        const now = Date.now();

        for (const L of LINE_MAP) {
            const key = READ_KEYS[L.channel];
            const [countData, barcodeData] = await Promise.all([
                getFieldLast(L.channel, L.fieldCount, key),
                getFieldLast(L.channel, L.fieldBarcode, key)
            ]);

            const countVal   = countData?.[`field${L.fieldCount}`] ?? "-";
            const barcodeVal = barcodeData?.[`field${L.fieldBarcode}`] ?? "-";

            let productName = "—";
            if (barcodeVal && barcodeVal !== "-") {
                const code = normalizeCode(barcodeVal);
                if (code && PRODUCT_MAP.has(code)) productName = PRODUCT_MAP.get(code);
            }

            const tStart = toLT(barcodeData?.created_at);
            const tLast  = toLT(countData?.created_at);

            if (!isNaN(Number(countVal))) totalCount += Number(countVal);

            const latestIso = (new Date(barcodeData?.created_at||0) > new Date(countData?.created_at||0))
                ? barcodeData?.created_at : countData?.created_at;

            let status="NEAKTYVI", statusCls="status-offline";
            if (latestIso) {
                const mins = (now - new Date(latestIso).getTime())/60000;
                if (mins <= OFFLINE_MINUTES) {
                    status="AKTYVI"; statusCls="status-online";
                }
            }

            let spTxt="–", gapTxt="–", spClass="";
            const history = await getFieldHistory(L.channel, L.fieldCount, key, 50);
            const pair = getLastValidCountPair(history, L.fieldCount);

            if (pair) {
                const dHours = (pair.t1 - pair.t0) / 3600000;
                if (dHours > 0) {
                    const speed = (pair.c1 - pair.c0) / dHours;
                    if (speed > 10) spClass="good";
                    else if (speed >= 5) spClass="warn";
                    else spClass="bad";
                    spTxt = speed.toFixed(2);
                    gapTxt = formatDuration(pair.t1 - pair.t0);
                }
            }

            html += `
            <tr>
                <td>${L.name}</td>
                <td class="good">${countVal}</td>
                <td class="bar">${barcodeVal}</td>
                <td>${productName}</td>
                <td class="time">${tStart}</td>
                <td class="time">${tLast}</td>
                <td class="${statusCls}">${status}</td>
                <td class="time">${gapTxt}</td>
                <td class="${spClass}">${spTxt}</td>
            </tr>
            `;
        }
        tbody.innerHTML = html;
        const totalStr = new Intl.NumberFormat("lt-LT",{maximumFractionDigits:0}).format(totalCount);
        const sb = document.getElementById("summaryBox");
        if(sb) sb.innerText = `Bendras pagamintas kiekis: ${totalStr} vnt.`;
    };

    function updateTimer() {
        const m = Math.floor(timer / 60);
        const s = String(Math.floor(timer % 60)).padStart(2,"0");
        const tb = document.getElementById("timerBox");
        if(tb) tb.innerText = `Kitas atnaujinimas po: ${m}:${s}`;
        timer--;
        if (timer < 0) timer = REFRESH_MS/1000;
    }

    // Init Logic
    window.refresh();
    setInterval(updateTimer,1000);
    setInterval(() => { timer = REFRESH_MS/1000; window.refresh(); }, REFRESH_MS);

    document.getElementById('statusMapFile').addEventListener('change', (ev)=>{
        const f = ev.target.files?.[0];
        const info = document.getElementById('statusMapInfo');
        if(!f){ info.textContent = "Failas nepasirinktas."; return; }
        info.textContent = "Kraunama…";
        loadProductMapFromXlsx(f, 'statusMapInfo')
            .then(()=>{ info.textContent += " (paruošta naudoti)"; })
            .catch(err=>{
                console.error(err);
                info.textContent = "Klaida skaitant failą: " + (err?.message || err);
            });
    });

})();

/* ================================================================================================
   LOGIC: REPORT TAB
   ================================================================================================ */
(function InitReport(){

    async function fetchFieldWindow(channel, field, readKey, startStr, endStr, tz){
        const base=`https://api.thingspeak.com/channels/${channel}/fields/${field}.json`;
        const qs=new URLSearchParams({ api_key:readKey, results:'8000', start:startStr, end:endStr, timezone:tz });
        const r = await fetch(`${base}?${qs.toString()}`);
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    }

    async function fetchWholePeriodNumeric(channel, field, readKey, tz, from, to, chunkDays=90){
        const feeds=[]; let curStart=new Date(from.getTime());
        while(curStart<to){
            const curEnd=new Date(Math.min(to.getTime(), curStart.getTime()+chunkDays*24*3600*1000));
            const js=await fetchFieldWindow(channel,field,readKey,toIsoLocal(curStart),toIsoLocal(curEnd),tz);
            if(js?.feeds?.length) feeds.push(...js.feeds);
            curStart=new Date(curEnd.getTime()+1000);
        }
        const out=[];
        for(const f of feeds){
            const v=parseFloat(f[`field${field}`]);
            if(isFinite(v)) out.push({t:parseISO(f.created_at).getTime(), v, at:f.created_at});
        }
        out.sort((a,b)=>a.t-b.t);
        const ded=[]; let lt=-1, lv;
        for(const x of out){ if(x.t!==lt || x.v!==lv){ ded.push(x); lt=x.t; lv=x.v; } }
        return ded;
    }

    async function fetchWholePeriodText(channel, field, readKey, tz, from, to, chunkDays=90){
        const feeds=[]; let curStart=new Date(from.getTime());
        while(curStart<to){
            const curEnd=new Date(Math.min(to.getTime(), curStart.getTime()+chunkDays*24*3600*1000));
            const js=await fetchFieldWindow(channel,field,readKey,toIsoLocal(curStart),toIsoLocal(curEnd),tz);
            if(js?.feeds?.length) feeds.push(...js.feeds);
            curStart=new Date(curEnd.getTime()+1000);
        }
        const out=[];
        for(const f of feeds){
            const val=f[`field${field}`];
            if(val!=null && val!=="") out.push({t:parseISO(f.created_at).getTime(), val:String(val), at:f.created_at});
        }
        out.sort((a,b)=>a.t-b.t);
        const ded=[]; let lt=-1, lv="";
        for(const x of out){ if(x.t!==lt || x.val!==lv){ ded.push(x); lt=x.t; lv=x.val; } }
        return ded;
    }

    function sumPositiveDeltas(counts){
        if(!counts.length) return {units:0,lastT:null};
        let units=0;
        for(let i=1;i<counts.length;i++){
            const diff=counts[i].v - counts[i-1].v;
            if(diff>0) units+=diff;
        }
        return {units,lastT:counts[counts.length-1].t};
    }

    function buildSegments(barcodes, counts, tz){
        const segs=[]; if(!barcodes.length) return segs;
        for(let i=0;i<barcodes.length;i++){
            const B0=barcodes[i], B1=barcodes[i+1]||null;
            const tStart=B0.t, tEnd=B1?B1.t:Infinity;
            const segCounts=counts.filter(c=>c.t>=tStart && c.t<tEnd);
            const {units,lastT}=sumPositiveDeltas(segCounts);
            const startLT=toLTString(B0.at,tz);
            const endLT  =lastT? toLTString(new Date(lastT).toISOString(),tz):"";
            const durationMs = lastT ? (lastT - tStart) : 0;
            const avg = (units>0 && durationMs>0) ? (units/(durationMs/3600000)) : null;

            const code = normalizeCode(B0.val);
            const prodName = PRODUCT_MAP.get(code) || "";
            segs.push({
            barcode:B0.val, product: prodName,
            startLT, endLT, duration: formatDuration(durationMs), units, avg,
            startDate: startLT ? new Date(startLT) : null,
            endDate:   endLT   ? new Date(endLT)   : null
            });
        }
        return segs;
    }

    async function exportXLSX(rows){
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Ataskaita', {views:[{state:'frozen', ySplit:1}]});

        ws.columns = [
            { header:'Linija', key:'line', width:14 },
            { header:'Gaminys', key:'barcode', width:14 },
            { header:'Gaminio pavadinimas', key:'product', width:24 },
            { header:'Testavimo pradžia', key:'start', width:20, style:{numFmt:'yyyy-mm-dd hh:mm:ss'} },
            { header:'Paskutinio testavimo pabaiga', key:'end', width:24, style:{numFmt:'yyyy-mm-dd hh:mm:ss'} },
            { header:'Trukmė', key:'duration', width:12 },
            { header:'Pagaminta vnt', key:'units', width:14 },
            { header:'Vidurkis vnt./val.', key:'avg', width:18 }
        ];
        ws.getRow(1).font = { bold:true, color:{argb:'FFFFFFFF'} };
        ws.getRow(1).alignment = { vertical:'middle', horizontal:'center' };
        ws.getRow(1).height = 22;
        ws.getRow(1).eachCell(cell=>{
            cell.fill   = { type:'pattern', pattern:'solid', fgColor:{argb:'FF333333'} };
            cell.border = { top:{style:'thin',color:{argb:'FF444444'}},
                            bottom:{style:'thin',color:{argb:'FF444444'}} };
        });

        rows.forEach(r=>{
            ws.addRow({
            line: r.line,
            barcode: r.barcode,
            product: r.product || "",
            start: r.startDate || null,
            end:   r.endDate   || null,
            duration: r.duration || "",
            units: r.units,
            avg: (r.avg!=null? Number(r.avg.toFixed(2)) : null)
            });
        });

        ws.autoFilter = { from:{row:1,col:1}, to:{row:1,col:8} };
        ws.getColumn('units').numFmt = '0';
        ws.getColumn('avg').numFmt   = '0.00';

        const buf = await wb.xlsx.writeBuffer();
        const fname = `GD_ataskaita_${new Date().toISOString().replace(/[:.]/g,'-')}.xlsx`;
        saveAs(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), fname);
    }

    async function generateReport(){
        const btn=document.getElementById('go');
        const st =document.getElementById('repStatus');
        const tz =document.getElementById('tz').value;
        const chunkDays=parseInt(document.getElementById('chunkDays').value,10)||90;

        const fromInp=document.getElementById('from').value;
        const toInp  =document.getElementById('to').value;
        const now=new Date();
        let from= fromInp? new Date(fromInp) : new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
        let to  = toInp  ? new Date(toInp)   : now;
        if(!(from instanceof Date)||!(to instanceof Date)||isNaN(from)||isNaN(to)||from>=to){
            st.textContent="Klaida: patikrink datų intervalą (Nuo < Iki)."; return;
        }

        const sel = Array.from(document.getElementById('lineFilter').selectedOptions).map(o=>o.value);
        const useLines = sel.length ? LINES.filter(L=>sel.includes(L.name)) : LINES;

        btn.disabled=true; st.textContent="Startuojam…";
        const out=[];

        for(const L of useLines){
            const key=READ_KEYS[L.channel];
            st.textContent=`${L.name}: barkodai…`;
            const bar = await fetchWholePeriodText   (L.channel, L.fieldBarcode, key, tz, from, to, chunkDays);
            st.textContent=`${L.name}: COUNT…`;
            const cnt = await fetchWholePeriodNumeric(L.channel, L.fieldCount  , key, tz, from, to, chunkDays);
            st.textContent=`${L.name}: skaičiuojam…`;
            const segs=buildSegments(bar, cnt, tz);

            segs.forEach(s=>{
            out.push({
                line: L.name,
                barcode: s.barcode,
                product: s.product,
                start: s.startLT, end: s.endLT,
                duration: s.duration, units: s.units, avg: s.avg,
                startDate: s.startDate, endDate: s.endDate
            });
            });
        }
        st.textContent=`Kuriame XLSX (${out.length} eilučių)…`;
        await exportXLSX(out);
        st.textContent=`✓ Baigta. Eilučių: ${out.length}`;
        btn.disabled=false;
    }

    // Init Logic for Report
    document.getElementById('go').addEventListener('click', ()=>{
        generateReport().catch(err=>{
            console.error(err);
            document.getElementById('repStatus').textContent = "Klaida: " + (err?.message||err);
            document.getElementById('go').disabled=false;
        });
    });
    document.getElementById('reportMapFile').addEventListener('change', (ev)=>{
        const f = ev.target.files?.[0];
        const info = document.getElementById('reportMapInfo');
        if(!f){ info.textContent = "Failas nepasirinktas."; return; }
        info.textContent = "Kraunama…";
        loadProductMapFromXlsx(f, 'reportMapInfo').catch(err=>{
            console.error(err);
            info.textContent = "Nepavyko perskaityti: " + (err?.message||err);
        });
    });

    // Init date inputs
    const now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
    const fmt=d=>{
        const y=d.getFullYear(), M=String(d.getMonth()+1).padStart(2,'0'),
            D=String(d.getDate()).padStart(2,'0'), h=String(d.getHours()).padStart(2,'0'),
            m=String(d.getMinutes()).padStart(2,'0');
        return `${y}-${M}-${D}T${h}:${m}`;
    };
    document.getElementById('from').value=fmt(start);
    document.getElementById('to').value  =fmt(now);

    // Init Line Filter
    const lf=document.getElementById('lineFilter');
    LINES.forEach(L=>{
        const opt=document.createElement('option');
        opt.value=L.name; opt.textContent=L.name; lf.appendChild(opt);
    });

    // Checkbox "Pažymėti visus" logika
    const sa = document.getElementById('selectAllLines');
    sa.addEventListener('change', () => {
        for(let i=0; i<lf.options.length; i++){
        lf.options[i].selected = sa.checked;
        }
    });
    // Jei vartotojas ranka nužymi kažką, nuimam varnelę "visus"
    lf.addEventListener('change', () => {
        let all=true;
        for(let i=0; i<lf.options.length; i++){
        if(!lf.options[i].selected){ all=false; break; }
        }
        sa.checked = all;
    });

})();

</script>
</body>
</html>
