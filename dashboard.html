<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šildymo Sistemos Dashboard</title>
    <!-- Highcharts -->
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.0/highcharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.0/highcharts-more.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.0/modules/solid-gauge.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1b26;
            color: #c0caf5;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #3b4261;
            border-radius: 4px;
            cursor: pointer;
            background-color: #24283b;
            color: #c0caf5;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #3b4261;
            color: #ffffff;
        }
        button.active {
            background-color: #0db9d7;
            color: #000;
            border-color: #0db9d7;
            font-weight: bold;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #24283b;
            border: 1px solid #3b4261;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            position: relative;
            transition: border-color 0.3s;
        }
        .card.active-card {
            border-color: #0db9d7;
        }
        .card-title {
            font-size: 14px;
            color: #9aa5ce;
            margin-bottom: 10px;
        }
        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: #0db9d7;
            margin-bottom: 10px;
        }
        .gauge-container {
            height: 120px;
            width: 100%;
        }
        .chart-box {
            background-color: #24283b;
            border: 1px solid #3b4261;
            border-radius: 8px;
            padding: 20px;
        }
        #chart-container {
            width: 100%;
            height: 400px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #9aa5ce;
            padding: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Šildymo sistemos</h1>
        <div class="controls">
            <button id="btn-day" class="active" onclick="fetchData(1, this)">Para</button>
            <button id="btn-week" onclick="fetchData(7, this)">Savaitė</button>
            <button id="btn-month" onclick="fetchData(30, this)">Mėnuo</button>
        </div>
    </div>

    <div id="loading" class="loading">Kraunami duomenys...</div>

    <div id="dashboard-content" style="display: none;">
        <div class="cards">
            <!-- Pečius -->
            <div class="card active-card">
                <div class="card-title">Pečius</div>
                <div class="card-value" id="val-pecius">-- °C</div>
                <div id="gauge-pecius" class="gauge-container"></div>
            </div>
            <!-- Radiatoriai -->
            <div class="card">
                <div class="card-title">Radiatoriai</div>
                <div class="card-value" id="val-radiatoriai">-- °C</div>
                <div id="gauge-radiatoriai" class="gauge-container"></div>
            </div>
            <!-- Boileris -->
            <div class="card">
                <div class="card-title">Boileris</div>
                <div class="card-value" id="val-boileris">-- °C</div>
                <div id="gauge-boileris" class="gauge-container"></div>
            </div>
            <!-- Grindinis -->
            <div class="card">
                <div class="card-title">Grindinis šildymas</div>
                <div class="card-value" id="val-grindinis">-- °C</div>
                <div id="gauge-grindinis" class="gauge-container"></div>
            </div>
        </div>

        <div class="chart-box">
            <div id="chart-container"></div>
        </div>
    </div>
</div>

<script>
    const channelId = '351746';
    const apiKey = 'ASBGVMMPC9JGLR8L';
    let mainChart;
    let gaugePecius, gaugeRadiatoriai, gaugeBoileris, gaugeGrindinis;

    // Bendra Gauge konfigūracija
    const gaugeOptions = {
        chart: {
            type: 'solidgauge',
            backgroundColor: 'transparent'
        },
        title: null,
        pane: {
            center: ['50%', '85%'],
            size: '140%',
            startAngle: -90,
            endAngle: 90,
            background: {
                backgroundColor: '#1a1b26',
                innerRadius: '60%',
                outerRadius: '100%',
                shape: 'arc',
                borderWidth: 0
            }
        },
        exporting: { enabled: false },
        tooltip: { enabled: false },
        yAxis: {
            stops: [
                [0.1, '#3b4261'],
                [0.5, '#0db9d7'],
                [0.9, '#ff9e64']
            ],
            lineWidth: 0,
            tickWidth: 0,
            minorTickInterval: null,
            tickAmount: 2,
            labels: {
                y: 16,
                style: { color: '#9aa5ce' }
            }
        },
        plotOptions: {
            solidgauge: {
                dataLabels: { enabled: false },
                linecap: 'round',
                stickyTracking: false,
                rounded: true
            }
        },
        credits: { enabled: false }
    };

    function initCharts() {
        // Highcharts global options for Dark Theme
        Highcharts.setOptions({
            chart: { backgroundColor: 'transparent', style: { fontFamily: 'Arial, sans-serif' } },
            title: { style: { color: '#ffffff' } },
            xAxis: {
                gridLineColor: '#3b4261',
                labels: { style: { color: '#9aa5ce' } },
                lineColor: '#3b4261',
                tickColor: '#3b4261'
            },
            yAxis: {
                gridLineColor: '#3b4261',
                labels: { style: { color: '#9aa5ce' } },
                title: { style: { color: '#9aa5ce' } }
            },
            legend: {
                itemStyle: { color: '#9aa5ce' },
                itemHoverStyle: { color: '#ffffff' }
            },
            tooltip: {
                backgroundColor: 'rgba(26, 27, 38, 0.85)',
                style: { color: '#ffffff' },
                borderColor: '#3b4261'
            }
        });

        // Gauges (Max 90)
        gaugePecius = Highcharts.chart('gauge-pecius', Highcharts.merge(gaugeOptions, {
            yAxis: { min: 0, max: 90 },
            series: [{ name: 'Pečius', data: [0] }]
        }));
        gaugeBoileris = Highcharts.chart('gauge-boileris', Highcharts.merge(gaugeOptions, {
            yAxis: { min: 0, max: 90 },
            series: [{ name: 'Boileris', data: [0] }]
        }));

        // Gauges (Max 50)
        gaugeRadiatoriai = Highcharts.chart('gauge-radiatoriai', Highcharts.merge(gaugeOptions, {
            yAxis: { min: 0, max: 50 },
            series: [{ name: 'Radiatoriai', data: [0] }]
        }));
        gaugeGrindinis = Highcharts.chart('gauge-grindinis', Highcharts.merge(gaugeOptions, {
            yAxis: { min: 0, max: 50 },
            series: [{ name: 'Grindinis', data: [0] }]
        }));

        // Pagrindinis Spline grafikas
        mainChart = Highcharts.chart('chart-container', {
            chart: { type: 'spline', zoomType: 'x' },
            title: { text: '' },
            xAxis: { type: 'datetime' },
            yAxis: { title: { text: 'Temperatūra (°C)' } },
            tooltip: { shared: true, valueSuffix: ' °C', xDateFormat: '%Y-%m-%d %H:%M' },
            plotOptions: {
                spline: { marker: { enabled: false }, lineWidth: 2 }
            },
            series: [
                { name: 'Pečius (F1)', data: [], color: '#ff9e64' },
                { name: 'Radiatoriai (F2)', data: [], color: '#f7768e' },
                { name: 'Boileris (F3)', data: [], color: '#7aa2f7' },
                { name: 'Grindinis (F4)', data: [], color: '#9ece6a' }
            ],
            time: { useUTC: false },
            credits: { enabled: false }
        });
    }

    async function fetchData(days, btn) {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('dashboard-content').style.display = 'none';

        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        const url = `https://api.thingspeak.com/channels/${channelId}/feeds.json?api_key=${apiKey}&days=${days}`;

        try {
            const response = await fetch(url);
            const json = await response.json();
            const feeds = json.feeds;

            const peciusData = [];      // Field 1 (sumaisyta su Grindiniu)
            const radiatoriaiData = []; // Field 2 (sumaisyta su Boileriu)
            const boilerisData = [];    // Field 3 (buvo Radiatoriai, dabar Boileris)
            const grindinisData = [];   // Field 4 (buvo Pecius, dabar Grindinis)
            const baterijaData = [];

            let lastPecius = null, lastRadiatoriai = null, lastBoileris = null, lastGrindinis = null, lastBaterija = null;

            feeds.forEach(feed => {
                const time = new Date(feed.created_at).getTime();

                // Field 1 dabar yra Pečius (buvo Grindinis)
                if (feed.field1 !== null) {
                    const val = parseFloat(feed.field1);
                    peciusData.push([time, val]);
                    lastPecius = val;
                }

                // Field 2 dabar yra Radiatoriai (buvo Boileris)
                if (feed.field2 !== null) {
                    const val = parseFloat(feed.field2);
                    radiatoriaiData.push([time, val]);
                    lastRadiatoriai = val;
                }

                // Field 3 dabar yra Boileris (buvo Radiatoriai)
                if (feed.field3 !== null) {
                    const val = parseFloat(feed.field3);
                    boilerisData.push([time, val]);
                    lastBoileris = val;
                }

                // Field 4 dabar yra Grindinis šildymas (buvo Pečius)
                if (feed.field4 !== null) {
                    const val = parseFloat(feed.field4);
                    grindinisData.push([time, val]);
                    lastGrindinis = val;
                }
            });

            // Atnaujiname Gauge ir tekstus viršuje
            if (lastPecius !== null) {
                document.getElementById('val-pecius').innerText = lastPecius.toFixed(1) + ' °C';
                gaugePecius.series[0].points[0].update(lastPecius);
            }
            if (lastRadiatoriai !== null) {
                document.getElementById('val-radiatoriai').innerText = lastRadiatoriai.toFixed(1) + ' °C';
                gaugeRadiatoriai.series[0].points[0].update(lastRadiatoriai);
            }
            if (lastBoileris !== null) {
                document.getElementById('val-boileris').innerText = lastBoileris.toFixed(1) + ' °C';
                gaugeBoileris.series[0].points[0].update(lastBoileris);
            }
            if (lastGrindinis !== null) {
                document.getElementById('val-grindinis').innerText = lastGrindinis.toFixed(1) + ' °C';
                gaugeGrindinis.series[0].points[0].update(lastGrindinis);
            }

            // Atnaujiname pagrindinį grafiką
            mainChart.series[0].setData(peciusData, false);
            mainChart.series[1].setData(radiatoriaiData, false);
            mainChart.series[2].setData(boilerisData, false);
            mainChart.series[3].setData(grindinisData, false);
            mainChart.redraw();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';

        } catch (error) {
            console.error('Klaida:', error);
            document.getElementById('loading').innerText = 'Klaida gaunant duomenis. Patikrinkite ryšį.';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCharts();
        fetchData(1, document.getElementById('btn-day'));
    });
</script>

</body>
</html>
